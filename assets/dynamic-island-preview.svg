<svg width="850" height="200" viewBox="0 0 850 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="island-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040812" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#071426" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#030710" stop-opacity="0.96" />
    </linearGradient>

    <!-- Pill Background Gradient -->
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101e" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#030811" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="cyan-glow-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <!-- Golden Arc Reactor Nucleus Gradient -->
    <radialGradient id="reactor-core-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fff3b0" />
      <stop offset="55%" stop-color="#ffaa00" />
      <stop offset="85%" stop-color="#e65c00" />
      <stop offset="100%" stop-color="#551a00" stop-opacity="0.8" />
    </radialGradient>

    <!-- Reactor Halo Gradient -->
    <radialGradient id="reactor-halo-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa00" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#ff6600" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ff3300" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Heavy Bloom Filter -->
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Continuous Spin for Outer Mechanical Ring */
    @keyframes spin-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    /* Counter Rotation for Inner Containment Ring */
    @keyframes spin-ccw {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    /* Core Nucleus Breathing Glow */
    @keyframes core-pulse {
      0%, 100% { transform: scale(0.92); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    /* Traveling Photon Sweep along Pill Perimeter */
    @keyframes photon-sweep {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -880; }
    }
    /* Live Audio Waveform Bars */
    @keyframes bar-wave {
      0%, 100% { transform: scaleY(0.3); }
      50% { transform: scaleY(1.0); }
    }
    /* Subtle Pill Ambient Glow Pulse */
    @keyframes ambient-glow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.85; }
    }

    .pill-photon {
      stroke-dasharray: 120 760;
      animation: photon-sweep 3.5s linear infinite;
    }
    .reactor-cage {
      transform-origin: 105px 95px;
      animation: spin-cw 12s linear infinite;
    }
    .reactor-inner {
      transform-origin: 105px 95px;
      animation: spin-ccw 7s linear infinite;
    }
    .reactor-nucleus {
      transform-origin: 105px 95px;
      animation: core-pulse 1.8s ease-in-out infinite;
    }
    .ambient-pulse {
      animation: ambient-glow 3s ease-in-out infinite;
    }

    /* Waveform Bars with Staggered Delays */
    .wb-1 { animation: bar-wave 0.8s ease-in-out infinite 0.1s; transform-origin: 290px 96px; }
    .wb-2 { animation: bar-wave 1.1s ease-in-out infinite 0.3s; transform-origin: 296px 96px; }
    .wb-3 { animation: bar-wave 0.7s ease-in-out infinite 0.0s; transform-origin: 302px 96px; }
    .wb-4 { animation: bar-wave 1.3s ease-in-out infinite 0.4s; transform-origin: 308px 96px; }
    .wb-5 { animation: bar-wave 0.9s ease-in-out infinite 0.2s; transform-origin: 314px 96px; }
    .wb-6 { animation: bar-wave 1.2s ease-in-out infinite 0.5s; transform-origin: 320px 96px; }
    .wb-7 { animation: bar-wave 0.8s ease-in-out infinite 0.15s; transform-origin: 326px 96px; }
    .wb-8 { animation: bar-wave 1.0s ease-in-out infinite 0.35s; transform-origin: 332px 96px; }
    .wb-9 { animation: bar-wave 0.75s ease-in-out infinite 0.05s; transform-origin: 338px 96px; }
    .wb-10 { animation: bar-wave 1.15s ease-in-out infinite 0.45s; transform-origin: 344px 96px; }
  </style>

  <!-- Outer Dashboard Canvas Box -->
  <rect x="1" y="1" width="848" height="198" rx="14" fill="url(#island-bg-grad)" stroke="#1a2d47" stroke-width="1.5" />

  <!-- Corner Tech HUD Accents -->
  <path d="M 12 28 L 12 12 L 28 12" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 838 28 L 838 12 L 822 12" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 12 172 L 12 188 L 28 188" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 838 172 L 838 188 L 822 188" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8" />

  <!-- Header Section -->
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#00f2fe" letter-spacing="1.5">
    J.A.R.V.I.S. — 008 <tspan fill="#64748b" font-weight="500"> // DYNAMIC ISLAND 2.0 // PERSISTENT COMPANION</tspan>
  </text>
  <line x1="36" y1="40" x2="814" y2="40" stroke="#13243a" stroke-width="1" />

  <!-- ========================================================== -->
  <!-- LEFT: COMPACT PILL (180x42 DIP Scale Model)                -->
  <!-- ========================================================== -->

  <!-- Pill Ambient Glow Halo -->
  <rect x="58" y="58" width="354" height="74" rx="37" fill="none" stroke="#00f2fe" stroke-width="8" filter="url(#cyan-glow)" class="ambient-pulse" opacity="0.3" />

  <!-- Pill Container Background -->
  <rect x="60" y="60" width="350" height="70" rx="35" fill="url(#pill-bg)" stroke="#16304d" stroke-width="1.2" />

  <!-- Animated Traveling Photon Light Sweep on Border -->
  <rect x="60" y="60" width="350" height="70" rx="35" fill="none" stroke="url(#cyan-glow-border)" stroke-width="2" class="pill-photon" filter="url(#cyan-glow)" />

  <!-- MINIATURE 5-LAYER ARC REACTOR -->
  <g id="mini-arc-reactor">
    <!-- Layer 0: Ambient Energy Corona -->
    <circle cx="105" cy="95" r="32" fill="url(#reactor-halo-grad)" />

    <!-- Layer 4: Outer Mechanical Frame / Stabilizer Ring -->
    <circle cx="105" cy="95" r="24" fill="none" stroke="#2a4563" stroke-width="1.5" />
    <circle cx="105" cy="95" r="21" fill="none" stroke="#3d628d" stroke-width="0.8" stroke-dasharray="3 3" />

    <!-- Layer 5: 4-Axis Mechanical Connectors (0°, 90°, 180°, 270°) -->
    <rect x="103" y="68" width="4" height="7" rx="1.5" fill="#d9e6f2" stroke="#5a80a6" stroke-width="0.5" />
    <rect x="103" y="115" width="4" height="7" rx="1.5" fill="#d9e6f2" stroke="#5a80a6" stroke-width="0.5" />
    <rect x="78" y="93" width="7" height="4" rx="1.5" fill="#d9e6f2" stroke="#5a80a6" stroke-width="0.5" />
    <rect x="125" y="93" width="7" height="4" rx="1.5" fill="#d9e6f2" stroke="#5a80a6" stroke-width="0.5" />

    <!-- Layer 3: Segmented Outer Cage (Clockwise Rotation) -->
    <g class="reactor-cage">
      <circle cx="105" cy="95" r="18" fill="none" stroke="#8faec9" stroke-width="2" stroke-dasharray="8 6" />
      <circle cx="105" cy="95" r="15" fill="none" stroke="#ffd166" stroke-width="0.8" stroke-dasharray="4 8" opacity="0.7" />
    </g>

    <!-- Layer 2: Counter-Rotating Containment Ring (Counter-Clockwise) -->
    <g class="reactor-inner">
      <circle cx="105" cy="95" r="12" fill="none" stroke="#ffaa00" stroke-width="1.8" stroke-dasharray="5 4" />
    </g>

    <!-- Layer 1: Geometric Core Sphere & Breathing Nucleus -->
    <g class="reactor-nucleus">
      <circle cx="105" cy="95" r="9" fill="url(#reactor-core-grad)" filter="url(#bloom)" />
      <circle cx="105" cy="95" r="4" fill="#ffffff" />
    </g>
  </g>

  <!-- Typography: J.A.R.V.I.S Branding & Telemetry Dots -->
  <text x="146" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="1">
    J.A.R.V.I.S. — 008
  </text>
  <circle cx="236" cy="82" r="1.8" fill="#00f2fe" />
  <circle cx="242" cy="82" r="1.8" fill="#00f2fe" />
  <circle cx="248" cy="82" r="1.8" fill="#00f2fe" />
  <circle cx="254" cy="82" r="1.8" fill="#00f2fe" />

  <!-- Subtitle: State Indicator -->
  <text x="146" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#00f2fe" letter-spacing="1">
    ● LISTENING
  </text>

  <!-- Voice-Reactive Audio Waveform Visualizer -->
  <g id="waveform-visualizer">
    <rect class="wb-1" x="288" y="84" width="2.5" height="24" rx="1.2" fill="#00f2fe" />
    <rect class="wb-2" x="294" y="80" width="2.5" height="32" rx="1.2" fill="#00f2fe" />
    <rect class="wb-3" x="300" y="76" width="2.5" height="40" rx="1.2" fill="#4facfe" />
    <rect class="wb-4" x="306" y="82" width="2.5" height="28" rx="1.2" fill="#00f2fe" />
    <rect class="wb-5" x="312" y="78" width="2.5" height="36" rx="1.2" fill="#38ef7d" />
    <rect class="wb-6" x="318" y="84" width="2.5" height="24" rx="1.2" fill="#00f2fe" />
    <rect class="wb-7" x="324" y="80" width="2.5" height="32" rx="1.2" fill="#4facfe" />
    <rect class="wb-8" x="330" y="86" width="2.5" height="20" rx="1.2" fill="#00f2fe" />
    <rect class="wb-9" x="336" y="82" width="2.5" height="28" rx="1.2" fill="#38ef7d" />
    <rect class="wb-10" x="342" y="88" width="2.5" height="16" rx="1.2" fill="#00f2fe" />
  </g>

  <!-- Expansion Arrow Indicator -->
  <polygon points="380,92 390,92 385,98" fill="#64748b" />

  <!-- Footnote under Pill -->
  <text x="64" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b">
    Compact Pill: <tspan fill="#00f2fe" font-weight="600">180 × 42 DIP</tspan>  •  Live Edge: <tspan fill="#38ef7d" font-weight="600">30 FPS Traveling Photon Sweep</tspan>
  </text>
  <text x="64" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#506176">
    Controls Drawer Sync: <tspan fill="#ffd166">Main HUD Drawer ↔ System Tray ↔ Island Hide</tspan>
  </text>

  <!-- ========================================================== -->
  <!-- RIGHT: TELEMETRY & MULTI-STATE PREVIEW CARDS               -->
  <!-- ========================================================== -->
  <g transform="translate(450, 52)">
    <!-- Section Title -->
    <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8ca0ba" letter-spacing="1">
      MULTI-STATE HOLOGRAPHIC MODES
    </text>

    <!-- State Card 1: IDLE -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="84" height="42" rx="6" fill="#071322" stroke="#253a54" stroke-width="1" />
      <circle cx="16" cy="21" r="7" fill="#ffaa00" opacity="0.8" />
      <text x="30" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#ffaa00">IDLE</text>
      <text x="30" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" fill="#8ca0ba">Warm Glow</text>
    </g>

    <!-- State Card 2: LISTENING -->
    <g transform="translate(94, 24)">
      <rect x="0" y="0" width="84" height="42" rx="6" fill="#071829" stroke="#00f2fe" stroke-width="1" />
      <circle cx="16" cy="21" r="7" fill="#00f2fe" filter="url(#cyan-glow)" />
      <text x="30" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#00f2fe">LISTENING</text>
      <text x="30" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" fill="#8ca0ba">Cyan Sweep</text>
    </g>

    <!-- State Card 3: THINKING -->
    <g transform="translate(188, 24)">
      <rect x="0" y="0" width="84" height="42" rx="6" fill="#071328" stroke="#4facfe" stroke-width="1" />
      <circle cx="16" cy="21" r="7" fill="#4facfe" />
      <text x="30" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#4facfe">THINKING</text>
      <text x="30" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" fill="#8ca0ba">Orbital Pulse</text>
    </g>

    <!-- State Card 4: SPEAKING -->
    <g transform="translate(282, 24)">
      <rect x="0" y="0" width="84" height="42" rx="6" fill="#181308" stroke="#ffd166" stroke-width="1" />
      <circle cx="16" cy="21" r="7" fill="#ffd166" filter="url(#bloom)" />
      <text x="30" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#ffd166">SPEAKING</text>
      <text x="30" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" fill="#8ca0ba">Voice Reactive</text>
    </g>

    <!-- Feature Checklist Bullet Points -->
    <g transform="translate(0, 80)">
      <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#00f2fe">
        ✔ <tspan fill="#cbd5e1">Always-on persistence across desktop and tray minimization</tspan>
      </text>
      <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#00f2fe">
        ✔ <tspan fill="#cbd5e1">Click to expand into full telemetry card (Mic, Output, Interrupt, Hide)</tspan>
      </text>
      <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#00f2fe">
        ✔ <tspan fill="#cbd5e1">DPI-aware placement: Top Center, Top Left, Top Right, Bottom Center</tspan>
      </text>
    </g>
  </g>
</svg>

