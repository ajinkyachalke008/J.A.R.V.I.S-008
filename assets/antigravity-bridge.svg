<svg width="850" height="180" viewBox="0 0 850 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bridge-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#061224" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091526" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#050d1a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="bridge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes packet-1 {
      0% { cx: 245px; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { cx: 310px; opacity: 0; }
    }
    @keyframes packet-2 {
      0% { cx: 535px; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { cx: 600px; opacity: 0; }
    }
    @keyframes pulse-node {
      0%, 100% { stroke-width: 1.5; opacity: 0.8; }
      50% { stroke-width: 2.5; opacity: 1; }
    }
    .flow-packet-1 {
      animation: packet-1 1.6s infinite ease-in-out;
    }
    .flow-packet-2 {
      animation: packet-2 1.6s infinite ease-in-out 0.8s;
    }
    .card-border-pulse {
      animation: pulse-node 2.5s infinite ease-in-out;
    }
  </style>

  <!-- Canvas Box -->
  <rect x="1" y="1" width="848" height="178" rx="14" fill="url(#bridge-bg-grad)" stroke="#1a2d47" stroke-width="1.5" />

  <!-- Corner Brackets -->
  <path d="M 12 26 L 12 12 L 26 12" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 838 26 L 838 12 L 824 12" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 12 154 L 12 168 L 26 168" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 838 154 L 838 168 L 824 168" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8" />

  <!-- Title Header -->
  <text x="36" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#00f2fe" letter-spacing="1.5">
    ANTIGRAVITY IDE CHAT INPUT &amp; NEURAL BRIDGE <tspan fill="#64748b" font-weight="500"> // PROGRAMMATIC AGENT PROMPT DISPATCH</tspan>
  </text>
  <line x1="36" y1="38" x2="814" y2="38" stroke="#13243a" stroke-width="1" />

  <!-- ========================================================== -->
  <!-- NODE 1: JARVIS VOICE & TOOL DISPATCH                       -->
  <!-- ========================================================== -->
  <g transform="translate(36, 50)">
    <rect x="0" y="0" width="205" height="106" rx="10" fill="url(#card-grad)" stroke="#00f2fe" stroke-width="1.5" class="card-border-pulse" />
    <circle cx="20" cy="22" r="5" fill="#00f2fe" filter="url(#bridge-glow)" />
    <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">JARVIS MARK LVI</text>
    <text x="34" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#8ca0ba">Voice / Assistant Runtime</text>

    <!-- Sub-badge -->
    <rect x="12" y="52" width="181" height="22" rx="4" fill="#05101e" stroke="#1b365d" stroke-width="1" />
    <text x="20" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#ffd166">🎙️ "Ask Antigravity to..."</text>

    <text x="12" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#64748b">
      Tool: <tspan fill="#38ef7d">actions/antigravity_chat.py</tspan>
    </text>
    <text x="12" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" fill="#506176">
      Auto-discovered action declaration
    </text>
  </g>

  <!-- DATA BUS 1 (Connecting Line & Flow Packets) -->
  <line x1="241" y1="103" x2="310" y2="103" stroke="#1e3a5f" stroke-width="3" stroke-dasharray="4 4" />
  <circle cy="103" r="4.5" fill="#00f2fe" filter="url(#bridge-glow)" class="flow-packet-1" />

  <!-- ========================================================== -->
  <!-- NODE 2: WIN32 IPC & CLIPBOARD GUARD                        -->
  <!-- ========================================================== -->
  <g transform="translate(310, 50)">
    <rect x="0" y="0" width="225" height="106" rx="10" fill="url(#card-grad)" stroke="#4facfe" stroke-width="1.5" />
    <circle cx="20" cy="22" r="5" fill="#4facfe" />
    <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">WIN32 IPC CONTROLLER</text>
    <text x="34" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#8ca0ba">AntigravityController Engine</text>

    <!-- Checklist / Capabilities -->
    <text x="14" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#cbd5e1">
      ⚡ <tspan fill="#00f2fe">Window Focus:</tspan> HWND_TOPMOST &amp; Raise
    </text>
    <text x="14" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#cbd5e1">
      🛡️ <tspan fill="#38ef7d">Clipboard Guard:</tspan> Atomic Backup &amp; Restore
    </text>
    <text x="14" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#cbd5e1">
      🎯 <tspan fill="#ffd166">Target Focus:</tspan> Ctrl+L Chat Bar Focus
    </text>
    <text x="14" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" fill="#64748b">
      Isolation: appidentity.py Ancestor Clean
    </text>
  </g>

  <!-- DATA BUS 2 (Connecting Line & Flow Packets) -->
  <line x1="535" y1="103" x2="604" y2="103" stroke="#1e3a5f" stroke-width="3" stroke-dasharray="4 4" />
  <circle cy="103" r="4.5" fill="#38ef7d" filter="url(#bridge-glow)" class="flow-packet-2" />

  <!-- ========================================================== -->
  <!-- NODE 3: GOOGLE ANTIGRAVITY IDE                             -->
  <!-- ========================================================== -->
  <g transform="translate(604, 50)">
    <rect x="0" y="0" width="210" height="106" rx="10" fill="url(#card-grad)" stroke="#38ef7d" stroke-width="1.5" />
    <circle cx="20" cy="22" r="5" fill="#38ef7d" filter="url(#bridge-glow)" />
    <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">ANTIGRAVITY IDE</text>
    <text x="34" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#8ca0ba">Target Agent Chat Window</text>

    <!-- Sub-badge -->
    <rect x="12" y="52" width="186" height="22" rx="4" fill="#071b14" stroke="#1b5d3a" stroke-width="1" />
    <text x="20" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#38ef7d">💬 Prompt Inserted &amp; Executed</text>

    <text x="12" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#cbd5e1">
      Modes: <tspan fill="#00f2fe">submit=True</tspan> | <tspan fill="#8ca0ba">submit=False</tspan>
    </text>
    <text x="12" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" fill="#64748b">
      REST API: http://127.0.0.1:24680
    </text>
  </g>
</svg>
