<svg width="850" height="150" viewBox="0 0 850 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="v-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#081426" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#060b16" stop-opacity="0.96" />
    </linearGradient>
    <linearGradient id="v-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="stream-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#38ef7d" />
    </linearGradient>
    <filter id="v-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes dash {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulse-node {
      0%, 100% { r: 5px; opacity: 0.8; }
      50% { r: 8px; opacity: 1; }
    }
    .flow-line {
      stroke-dasharray: 6 4;
      animation: dash 1.5s linear infinite;
    }
    .p-node {
      animation: pulse-node 2s infinite ease-in-out;
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="848" height="148" rx="14" fill="url(#v-bg)" stroke="url(#v-border)" stroke-width="1.5" />

  <!-- Pipeline Title -->
  <text x="30" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffd166" letter-spacing="1.5">
    🎙️ DUAL-MODE NEURAL VOICE PIPELINE // HYBRID GEMINI LIVE + ELEVENLABS
  </text>
  <text x="730" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38ef7d">
    ● 24 kHz PCM SYNCED
  </text>

  <!-- Connecting Stream Lines -->
  <line x1="210" y1="85" x2="270" y2="85" stroke="url(#stream-flow)" stroke-width="2" class="flow-line" />
  <polygon points="274,85 266,80 266,90" fill="#ffd166" />

  <line x1="430" y1="85" x2="490" y2="85" stroke="url(#stream-flow)" stroke-width="2" class="flow-line" />
  <polygon points="494,85 486,80 486,90" fill="#38ef7d" />

  <line x1="640" y1="85" x2="690" y2="85" stroke="url(#stream-flow)" stroke-width="2" class="flow-line" />
  <polygon points="694,85 686,80 686,90" fill="#00f2fe" />

  <!-- Node 1: Gemini Live Ingestion -->
  <g transform="translate(30, 52)">
    <rect width="180" height="66" rx="8" fill="#0d1b2e" stroke="#00f2fe" stroke-width="1" />
    <circle cx="20" cy="24" r="5" fill="#00f2fe" class="p-node" filter="url(#v-glow)" />
    <text x="34" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Gemini 3.1 Live</text>
    <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8ca0ba">Mic Capture • Vision • VAD</text>
  </g>

  <!-- Node 2: Hybrid Intercept -->
  <g transform="translate(275, 52)">
    <rect width="155" height="66" rx="8" fill="#151d28" stroke="#ffd166" stroke-width="1" />
    <circle cx="18" cy="24" r="5" fill="#ffd166" class="p-node" filter="url(#v-glow)" />
    <text x="32" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffd166">Hybrid Intercept</text>
    <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8ca0ba">Audio Suppress • Text Stream</text>
  </g>

  <!-- Node 3: ElevenLabs TTS -->
  <g transform="translate(495, 52)">
    <rect width="145" height="66" rx="8" fill="#0d2424" stroke="#38ef7d" stroke-width="1" />
    <circle cx="18" cy="24" r="5" fill="#38ef7d" class="p-node" filter="url(#v-glow)" />
    <text x="32" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38ef7d">ElevenLabs TTS</text>
    <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8ca0ba">Voice: ibbx9zDYGvLgt...</text>
  </g>

  <!-- Node 4: Dynamic Island & Speaker Queue -->
  <g transform="translate(695, 52)">
    <rect width="125" height="66" rx="8" fill="#131b2e" stroke="#00f2fe" stroke-width="1" />
    <circle cx="16" cy="24" r="5" fill="#00f2fe" class="p-node" filter="url(#v-glow)" />
    <text x="30" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00f2fe">Dynamic Island</text>
    <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8ca0ba">Speaker &amp; Visemes</text>
  </g>
</svg>